name: software-tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,jax]'
      - run: python -m ruff check src tests examples scripts
      - run: python -m pytest -q
      - run: python scripts/audit_release.py
      - run: python -m build
      - run: python scripts/audit_release.py --sdist dist/*.tar.gz
      - run: python -m twine check dist/*
      - name: Check installed wheel outside the source tree
        run: |
          python -m venv /tmp/hallulab-wheel
          /tmp/hallulab-wheel/bin/python -m pip install dist/*.whl jax
          cd /tmp
          /tmp/hallulab-wheel/bin/hallulab doctor
          /tmp/hallulab-wheel/bin/hallulab run hallucination_lab.toy:build --max-steps 3
          /tmp/hallulab-wheel/bin/hallulab run hallucination_lab.toy:build --resume runs/toy/checkpoint.npz
