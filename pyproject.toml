[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucination-lab"
version = "0.3.0rc3"
description = "Composable AF2 and AF3 protein hallucination research"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = {text = "Hallucination Lab: composable AF2 and AF3 protein hallucination research. The source distribution includes self-contained HTML documentation in docs/index.html, runnable examples, and numerical tests. Model runtimes and weights are installed separately.", content-type = "text/plain"}
dependencies = ["numpy>=1.26"]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics"]

[project.optional-dependencies]
jax = ["jax>=0.4.30"]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.9", "twine>=6"]

[project.scripts]
hallulab = "hallucination_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
